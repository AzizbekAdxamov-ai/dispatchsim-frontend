<!doctype html>
<html lang="en" data-theme="light">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import '/src/theme/tokens.css'
      import '/src/index.css'
      import OnTimeChart from '/src/components/dashboard/OnTimeChart.jsx'

      const params = new URLSearchParams(location.search)
      document.documentElement.dataset.theme = params.get('theme') === 'dark' ? 'dark' : 'light'
      const mode = params.get('mode') === 'zero' ? 'zero' : 'empty'
      const data = ['Thu', 'Fri', 'Sat', 'Sun', 'Mon', 'Tue', 'Wed'].map((day, index) => ({
        day,
        onTime: mode === 'zero' && index === 6 ? 0 : null,
      }))
      document.body.style.padding = '32px'
      createRoot(document.getElementById('root')).render(React.createElement(OnTimeChart, {
        data,
        labels: {
          title: 'On-time delivery performance',
          subtitle: 'Daily on-time delivery percentage',
          value: 'On time',
          empty: 'No deliveries recorded yet.',
        },
      }))
    </script>
  </body>
</html>
